<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code — Colobane Market</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0a0a 0%, #2d0f0f 50%, #1a0a0a 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px 40px;
      text-align: center;
      box-shadow: 0 25px 80px rgba(138,28,28,0.3), 0 0 0 1px rgba(138,28,28,0.1);
      max-width: 420px;
      width: 90%;
    }
    .logo-text {
      font-size: 28px;
      font-weight: 900;
      color: #8a1c1c;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
      font-weight: 500;
    }
    #qr-container {
      display: inline-block;
      padding: 16px;
      border: 3px solid #8a1c1c;
      border-radius: 16px;
      background: #fff;
    }
    #qr-container img {
      display: block;
      width: 250px;
      height: 250px;
      image-rendering: pixelated;
    }
    .url-text {
      margin-top: 24px;
      font-size: 16px;
      font-weight: 700;
      color: #8a1c1c;
      letter-spacing: 0.5px;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: #aaa;
    }
    .download-btn {
      margin-top: 24px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #8a1c1c, #c0392b);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(138,28,28,0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-text">🛒 Colobane Market</div>
    <div class="tagline">Marketplace N°1 du Sénégal</div>
    <div id="qr-container"></div>
    <div class="url-text">colobanemarketplac.com</div>
    <div class="subtitle">Scannez pour visiter le site</div>
    <button class="download-btn" onclick="downloadQR()">📥 Télécharger le QR Code</button>
  </div>

  <script>
    // Generate QR Code
    var qr = qrcode(0, 'H');
    qr.addData('https://colobanemarketplac.com');
    qr.make();

    // Render as image
    document.getElementById('qr-container').innerHTML = qr.createImgTag(6, 12);

    // Download function
    function downloadQR() {
      var canvas = document.createElement('canvas');
      var size = 1000;
      var padding = 120;
      var qrSize = size - padding * 2;
      canvas.width = size;
      canvas.height = size + 100;
      var ctx = canvas.getContext('2d');

      // White background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Border
      ctx.strokeStyle = '#8a1c1c';
      ctx.lineWidth = 6;
      ctx.roundRect(20, 20, canvas.width - 40, canvas.height - 40, 24);
      ctx.stroke();

      // Draw QR modules
      var moduleCount = qr.getModuleCount();
      var cellSize = qrSize / moduleCount;
      for (var r = 0; r < moduleCount; r++) {
        for (var c = 0; c < moduleCount; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(padding + c * cellSize, padding + r * cellSize, cellSize + 0.5, cellSize + 0.5);
          }
        }
      }

      // URL text
      ctx.fillStyle = '#8a1c1c';
      ctx.font = 'bold 36px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('colobanemarketplac.com', canvas.width / 2, size + 50);

      // Download
      var link = document.createElement('a');
      link.download = 'QR-Code-ColobaneMarket.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
